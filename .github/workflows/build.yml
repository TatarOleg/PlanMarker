
name: Build PlanMarker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o PlanMarker-android-source.zip
        
      - name: Fix JVM compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("PlanMarker/app/build.gradle.kts")
          s = p.read_text()

          marker = '    buildFeatures { compose = true }'
          replacement = '''    compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures { compose = true }'''

          if marker not in s:
              raise SystemExit("Could not find buildFeatures in app/build.gradle.kts")

          p.write_text(s.replace(marker, replacement, 1))
          print("Java and Kotlin targets set to 17")
          PY
          

      - name: Fix extra closing brace in room dialog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("PlanMarker/app/src/main/java/com/example/planmarker/MainActivity.kt")
          s = p.read_text()
          old = 'Text("Отмена") } } } })'
          new = 'Text("Отмена") } } })'
          if old not in s:
              raise SystemExit("Could not find the extra closing brace in room dialog")
          p.write_text(s.replace(old, new, 1))
          print("Removed the extra closing brace from the room dialog")
          PY


      - name: Fix Compose clickable component arguments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("PlanMarker/app/src/main/java/com/example/planmarker/MainActivity.kt")
          s = p.read_text()

          old_card = 'Card(Modifier.fillMaxWidth().padding(vertical=3.dp), onClick = {'
          new_card = 'Card(onClick = {'
          if old_card not in s:
              raise SystemExit("Could not find the room Card call")
          s = s.replace(old_card, new_card, 1)

          old_card_end = 'dialog=true }) { Row(Modifier.padding(10.dp)'
          new_card_end = 'dialog=true }, modifier = Modifier.fillMaxWidth().padding(vertical=3.dp)) { Row(Modifier.padding(10.dp)'
          if old_card_end not in s:
              raise SystemExit("Could not find the end of the room Card call")
          s = s.replace(old_card_end, new_card_end, 1)

          old_surface = 'Surface(Modifier.size(32.dp), color=Color(c.toLong()), shape=RoundedCornerShape(6.dp), onClick={ if(editingIndex>=0 && editingIndex in rooms.indices) rooms[editingIndex]=rooms[editingIndex].copy(color=c.toLong()) else pendingRect=pendingRect?.copy(color=c.toLong()) }) {}'
          new_surface = 'Surface(onClick={ if(editingIndex>=0 && editingIndex in rooms.indices) rooms[editingIndex]=rooms[editingIndex].copy(color=c.toLong()) else pendingRect=pendingRect?.copy(color=c.toLong()) }, modifier=Modifier.size(32.dp), color=Color(c.toLong()), shape=RoundedCornerShape(6.dp)) {}'
          if old_surface not in s:
              raise SystemExit("Could not find the room color Surface call")
          s = s.replace(old_surface, new_surface, 1)

          p.write_text(s)
          print("Fixed Card and Surface clickable argument order")
          PY

      - name: Diagnose Kotlin source
        run: |
          echo '--- MainActivity.kt lines 185-225 ---'
          nl -ba PlanMarker/app/src/main/java/com/example/planmarker/MainActivity.kt | sed -n '1,225p'
          echo '--- app/build.gradle.kts ---'
          cat PlanMarker/app/build.gradle.kts
          echo '--- project files ---'
          find PlanMarker -maxdepth 4 -type f | sort | head -80

      - name: Build APK
        run: gradle -p PlanMarker --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlanMarker-APK
          path: PlanMarker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
