
name: Build PlanMarker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip PlanMarker-android-source.zip

        
      - name: Align Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("PlanMarker/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {\n",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
              1
          )
          p.write_text(s)
          PY
          

      - name: Build APK
        run: gradle -p PlanMarker --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlanMarker-APK
          path: PlanMarker/app/build/outputs/apk/debug/app-debug.apk
